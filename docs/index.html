<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Note Save</title>
<meta name="theme-color" content="#4b3bc9">
<meta property="og:title" content="Note Save">
<meta property="og:description" content="Notes, files and chat in one place.">
<style>
:root{--pri:#6c5ce7;--pri2:#8e6cf6;--deep:#3b2fa8;--bg:#f4f3ff;--card:rgba(255,255,255,.82);--txt:#1f2340;--sub:#6b7090;--line:rgba(108,92,231,.16);--chip:#eeebff;--ok:#16a34a;--bad:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f22;--card:rgba(28,30,58,.78);--txt:#f1f2fa;--sub:#a3a8cc;--line:rgba(160,150,255,.18);--chip:#2a2d57}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#241a7a 0%,#4b3bc9 55%,#7b5cf0 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 16s ease-in-out infinite}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:#ff7ad9;left:-12vmax;top:-10vmax}
.bg i:nth-child(2){width:40vmax;height:40vmax;background:#5eead4;right:-10vmax;top:18vh;animation-delay:-5s}
.bg i:nth-child(3){width:44vmax;height:44vmax;background:#60a5fa;left:20vw;bottom:-18vmax;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,-3vmax) scale(1.12)}}
header{display:flex;align-items:center;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 20px 8px;max-width:760px;margin:0 auto}
.logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;backdrop-filter:blur(8px);font-size:22px}
header b{color:#fff;font-size:20px;letter-spacing:.3px}
main{max-width:760px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 18px 50px rgba(20,10,80,.28);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
h1{margin:0 0 6px;font-size:26px;line-height:1.2;word-break:break-word}
.meta{display:flex;align-items:center;gap:10px;margin:14px 0 18px;color:var(--sub);font-size:13px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.meta .n{color:var(--txt);font-weight:700;font-size:14px}
.body{white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.65}
.chip{display:inline-block;background:var(--chip);color:var(--pri);font-weight:700;font-size:14px;padding:2px 10px;border-radius:12px;text-decoration:none;margin:0 2px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;background:var(--chip);color:var(--pri)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{flex:1 1 180px;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 18px;border-radius:16px;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 8px 22px rgba(108,92,231,.45)}
.btn.p:hover{box-shadow:0 12px 28px rgba(108,92,231,.6)}
.btn.s{background:var(--chip);color:var(--pri)}
.hero{text-align:center;padding:10px 0 4px}
.hero .big{font-size:54px}
.hero p{color:var(--sub);margin:6px 0 0;line-height:1.55}
.lock{text-align:center;padding:10px 4px}
.lock .big{font-size:48px}
.lock h2{margin:8px 0 4px}
.lock p{color:var(--sub);margin:0;line-height:1.55}
.sk{height:16px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,var(--chip) 25%,rgba(255,255,255,.5) 37%,var(--chip) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.foot{text-align:center;color:rgba(255,255,255,.75);font-size:12px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:#1f2340;color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<header><div class="logo">✎</div><b>Note Save</b></header>
<main><div class="card" id="card"><div class="sk" style="width:60%;height:26px"></div><div class="sk"></div><div class="sk" style="width:85%"></div><div class="sk" style="width:70%"></div></div>
<div class="foot">Notes · Files · Chat — all in one place</div></main>
<div class="toast" id="toast"></div>
<script>
/* ====== SETTINGS - edit these ====== */
var DB   = "https://noteapp-1ad69-default-rtdb.firebaseio.com";   // Firebase Realtime Database
var APK  = "https://download1077.mediafire.com/jkw9rlufpjpgAF4GVwjKnbbUHcP0fD_VNHhksOZMNNwjugk04cWcOhP_M5tf1KvMTIBmkqKEJdJUXGg5lJ7EX4g0XudQIVCRT31cC3NCRbNtl3iZuhpUGIUlMEvInpo0_PY-LBC-qINt1FaEfZKCvemzzQzz05fJwcQSWTJYNvOtkcQ/pu6px19kutexg2h/Note+Save+With+Email_1.0.apk";                           // <- paste your MediaFire APK link here
var PKG  = "Note.Save.With.Email";
/* =================================== */

var card = document.getElementById("card");
var android = /Android/i.test(navigator.userAgent);
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function toast(t){ var x=document.getElementById("toast"); x.textContent=t; x.className="toast on"; setTimeout(function(){x.className="toast";},1800); }
function appLink(){ return "intent://"+location.host+location.pathname+location.search+"#Intent;scheme=https;package="+PKG+";end"; }
function btn(label, cls, href, fn){ var a=el("a","btn "+cls,label); if(href) a.href=href; if(fn) a.addEventListener("click",function(e){e.preventDefault();fn();}); return a; }
function actions(extra){
  var d=el("div","actions");
  if(android) d.appendChild(btn("🚀  Open in app","p",appLink()));
  d.appendChild(btn("⬇  Download app","s",APK));
  if(extra) for(var i=0;i<extra.length;i++) d.appendChild(extra[i]);
  return d;
}
function ago(ts){ if(!ts) return ""; var s=Math.floor((Date.now()-ts)/1000); if(s<60)return"just now"; if(s<3600)return Math.floor(s/60)+" min ago"; if(s<86400)return Math.floor(s/3600)+" h ago"; if(s<2592000)return Math.floor(s/86400)+" d ago"; return new Date(ts).toLocaleDateString(); }
function get(path){ return fetch(DB+"/"+path+".json").then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }

function landing(emoji, title, text){
  card.replaceChildren();
  var h=el("div","hero"); h.appendChild(el("div","big",emoji)); h.appendChild(el("h1","",title)); h.appendChild(el("p","",text)); card.appendChild(h);
  card.appendChild(actions());
}
function locked(title, text){
  card.replaceChildren();
  var h=el("div","lock"); h.appendChild(el("div","big","🔒")); h.appendChild(el("h2","",title)); h.appendChild(el("p","",text)); card.appendChild(h);
  card.appendChild(actions());
}

/* text with @file_ / @note_ / @username turned into chips (safe: only textContent) */
function rich(parent, text){
  var re=/(@file_[A-Z0-9]{6}|@note_[A-Z0-9]{6}|@[a-z0-9_]{3,20})/g, last=0, m;
  while((m=re.exec(text))){
    if(m.index>last) parent.appendChild(document.createTextNode(text.slice(last,m.index)));
    var t=m[0], a;
    if(t.indexOf("@file_")===0){ a=el("span","chip","📎 file · open in app"); }
    else if(t.indexOf("@note_")===0){ a=el("a","chip","📝 note"); a.href="/n/"+encodeURIComponent(t); (function(node,id){ get("v2/items/"+encodeURIComponent(id)+"/title").then(function(v){ if(v) node.textContent="📝 "+v; }).catch(function(){}); })(a,t); }
    else { a=el("a","chip","👤 "+t); a.href="/u/"+encodeURIComponent(t); }
    parent.appendChild(a);
    last=m.index+t.length;
  }
  if(last<text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}

function showNote(id){
  get("v2/items/"+encodeURIComponent(id)).then(function(n){
    if(!n || n.del) return locked("Note not available","This note was removed, or it is not public. Open the app to see notes shared with you.");
    if(n.vis!=="public") return locked("This note is not public","Only people it is shared with can open it. Open the app and sign in.");
    if(n.pass) return locked("Password protected","This note needs a password. Open it in the app.");
    card.replaceChildren();
    card.appendChild(el("h1","",n.title||"Untitled"));
    var meta=el("div","meta"), av=el("div","av","N"), who=el("div"), nm=el("div","n","…");
    who.appendChild(nm); who.appendChild(el("div","",ago(n.ts))); meta.appendChild(av); meta.appendChild(who);
    meta.appendChild(el("span","pill","🌐 Public"));
    card.appendChild(meta);
    var b=el("div","body"); rich(b, n.body||""); card.appendChild(b);
    var cp=btn("🔗  Copy link","s",null,function(){ if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(function(){toast("Link copied");});} });
    var ex=[cp];
    if(navigator.share) ex.push(btn("⤴  Share","s",null,function(){ navigator.share({title:n.title||"Note",url:location.href}).catch(function(){}); }));
    card.appendChild(actions(ex));
    document.title=(n.title||"Note")+" · Note Save";
    if(n.owner){
      get("v2/users/"+encodeURIComponent(n.owner)).then(function(u){ if(!u) return; }).catch(function(){});
      get("v2/users/"+encodeURIComponent(n.owner)+"/name").then(function(v){ if(v){ nm.textContent=v; if(av.firstChild) av.firstChild.textContent=v.charAt(0).toUpperCase(); } }).catch(function(){});
      get("v2/users/"+encodeURIComponent(n.owner)+"/photo").then(function(p){ if(p && /^https?:/.test(p)){ var im=new Image(); im.onload=function(){ av.replaceChildren(im); }; im.src=p; } }).catch(function(){});
    }
  }).catch(function(){ locked("Note not available","This note is private or was removed. Open the app and sign in to see it."); });
}

(function route(){
  var seg=location.pathname.replace(/^\/+|\/+$/g,"").split("/").filter(Boolean).map(function(s){ try{return decodeURIComponent(s);}catch(e){return s;} });
  if(!seg.length) return landing("📝","Note Save","Write notes, share files and chat — public notes can be opened right here.");
  var type=seg[0].toLowerCase(), val=seg[1];
  if(seg.length===1){ val=seg[0]; type = /^@note_/.test(val)?"n" : /^@file_/.test(val)?"f" : "u"; }
  if(type==="n"||type==="note") return val ? showNote(val) : landing("📝","Note Save","This link is not valid.");
  if(type==="f"||type==="file") return landing("📎","A file was shared with you","Files open inside the app. Open the app to preview or download it.");
  if(type==="u"||type==="user"||type==="profile"){
    var q=val||""; landing("👤", q||"Profile","Open this profile in the Note Save app.");
    return;
  }
  if(type==="c"||type==="chat") return landing("💬","Chat on Note Save","Open the app to start this chat"+(new URLSearchParams(location.search).get("t")?" — your message is already filled in.":"."));
  landing("📝","Note Save","This link is not valid.");
})();
</script>
</body>
</html>
